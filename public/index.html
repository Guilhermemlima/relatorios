<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Relatórios</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- LOGIN -->
  <div id="tela-login" class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <svg width="48" height="48" fill="none" viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#2563EB"/><path d="M14 16h20M14 24h20M14 32h12" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
        <h1>Relatórios</h1>
        <p>Sistema de acompanhamento</p>
      </div>
      <form id="form-login" autocomplete="off">
        <div class="campo">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="seu@email.com" required>
        </div>
        <div class="campo">
          <label>Senha</label>
          <input type="password" id="login-senha" placeholder="••••••••" required>
        </div>
        <div id="login-erro" class="erro-msg" style="display:none"></div>
        <button type="submit" class="btn-primario w100">Entrar</button>
      </form>
    </div>
  </div>

  <!-- APP -->
  <div id="app" style="display:none">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <svg width="32" height="32" fill="none" viewBox="0 0 48 48"><rect width="48" height="48" rx="10" fill="#fff"/><path d="M14 16h20M14 24h20M14 32h12" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/></svg>
        <span>Relatórios</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item ativo" data-pagina="dashboard">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/></svg>
          Dashboard
        </a>
        <a href="#" class="nav-item" data-pagina="novo">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Novo Relatório
        </a>
        <a href="#" class="nav-item" data-pagina="lista">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Todos os Relatórios
        </a>
        <a href="#" class="nav-item" data-pagina="meus">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Meus Relatórios
        </a>
        <div class="nav-separador">Exportar</div>
        <a href="#" class="nav-item" data-pagina="exportar">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Exportar
        </a>
        <div class="nav-separador admin-only">Administração</div>
        <a href="#" class="nav-item admin-only" data-pagina="usuarios">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="2"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Usuários
        </a>
      </nav>
      <div class="sidebar-user">
        <div class="user-avatar" id="user-avatar">A</div>
        <div class="user-info">
          <span id="user-nome">Usuário</span>
          <small id="user-cargo">Cargo</small>
        </div>
        <button class="btn-logout" onclick="logout()" title="Sair">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </aside>

    <!-- CONTEÚDO -->
    <main class="main-content">
      <!-- TOPO -->
      <header class="topbar">
        <button class="btn-menu" onclick="toggleSidebar()">
          <svg width="22" height="22" fill="none" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <h2 id="titulo-pagina">Dashboard</h2>
        <div class="topbar-direita">
          <span id="data-hoje" class="data-hoje"></span>
        </div>
      </header>

      <!-- PÁGINAS -->
      <div class="pagina ativa" id="pag-dashboard"></div>
      <div class="pagina" id="pag-novo"></div>
      <div class="pagina" id="pag-lista"></div>
      <div class="pagina" id="pag-meus"></div>
      <div class="pagina" id="pag-exportar"></div>
      <div class="pagina" id="pag-usuarios"></div>
      <div class="pagina" id="pag-ver"></div>
      <div class="pagina" id="pag-editar"></div>
    </main>
  </div>

  <!-- MODAL CONFIRMAÇÃO -->
  <div id="modal-confirma" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <h3 id="modal-titulo">Confirmar</h3>
      <p id="modal-texto"></p>
      <div class="modal-btns">
        <button class="btn-secundario" onclick="fecharModal()">Cancelar</button>
        <button class="btn-perigo" id="modal-ok">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
